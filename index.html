<title>Bedrock Box — Gift Menu</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px;width:min(420px,92vw)}
  .row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;
       padding:10px 14px;border-radius:14px;background:rgba(8,10,18,.72);
       box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);
       animation:in .55s ease both}
  .row:nth-child(1){animation-delay:.05s}
  .row:nth-child(2){animation-delay:.12s}
  .row:nth-child(3){animation-delay:.19s}
  .row:nth-child(4){animation-delay:.26s}
  .row:nth-child(5){animation-delay:.33s}
  .row img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .name{color:#fff;font-weight:700;font-size:18px;letter-spacing:.02em}
  .cost{color:rgba(255,255,255,.65);font-size:13px;margin-top:2px}
  .fx{color:#ff4d6d;font-weight:800;font-size:20px;white-space:nowrap}
  .row.follow .fx{color:#3dff9a}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
